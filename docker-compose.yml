services:
  mysql:
    image: mysql:8.0
    container_name: visitgrogol-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: visitgrogol
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional lightweight DB UI at http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: visitgrogol-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - mysql

volumes:
  mysql_data:
