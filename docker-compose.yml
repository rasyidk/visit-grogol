services:
  mysql:
    image: mysql:8.0
    container_name: visitgrogol-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: visitgrogol
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: visitgrogol-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - mysql

  backend:
    build:
      context: ./backend
    container_name: visitgrogol-backend
    restart: unless-stopped
    ports:
      - '4001:4000' # Mapped to 4001 outside to prevent collision
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=mysql://root:password@mysql:3306/visitgrogol
      - JWT_SECRET=change-this-to-a-long-random-secret
      - JWT_REFRESH_SECRET=change-this-too-another-long-random-secret
      - CORS_ORIGINS=http://localhost:3001,https://fe-visitgrogol.scholarlens.site
      - PUBLIC_BASE_URL=https://be-visitgrogol.scholarlens.site
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://be-visitgrogol.scholarlens.site/api/v1
    container_name: visitgrogol-frontend
    restart: unless-stopped
    ports:
      - '3001:3000' # Mapped to 3001 outside to prevent collision
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://be-visitgrogol.scholarlens.site/api/v1
      - NEXT_PUBLIC_SITE_URL=https://fe-visitgrogol.scholarlens.site
    depends_on:
      - backend

volumes:
  mysql_data:
